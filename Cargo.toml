[package]
name = "remote_control_windows"
version = "0.1.0"
edition = "2024"

[dependencies]
audiopus = "0.2.0"
bytemuck = "1.25.0"
bytes = "1.12.0"
cpal = "0.18.1"
directories = "6.0.0"
env_logger = "0.11.11"
hex = "0.4.3"
hmac = "0.13.0"
mdns-sd = "0.20.0"
openh264 = "0.9.3"
quinn = { version = "0.11.11" }
rand = "0.10.2"
rcgen = "0.14.8"
sha2 = "0.11.0"
sysinfo = "0.39.5"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
wasapi = "0.23.0"
wincode = { version = "0.5.5", features = ["derive"] }
windows = { version = "0.62.2",features = [
   "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }
yuv = "0.8.16"

[dev-dependencies]

